<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 1 - Mini ATM</title>
</head>
<body>

  <h2>Soal 1: Mini Mesin ATM</h2>

  <input type="number" id="inputNominal" placeholder="Masukkan nominal (Rp)..." />
  <br><br>
  <button id="tombolTarik">Tarik Tunai</button>
  <button id="tombolSetor">Setor</button>
  <button id="tombolCekSaldo">Cek Saldo</button>
  <p id="infoATM"></p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Validasi input dulu sebelum proses transaksi
    // Tips: Untuk Tarik, cek apakah saldo >= nominal

    let saldo = 500000;
    let nominalInput = document.getElementById('inputNominal');
    let tarik = document.getElementById('tombolTarik');
    let setor = document.getElementById('tombolSetor');
    let cek = document.getElementById('tombolCekSaldo');
    let teks = document.getElementById('infoATM');

    cek.addEventListener('click', function(){
      teks.innerText = `Saldo kamu: Rp ${saldo}`;
    });

    setor.addEventListener('click', function(){
      const nominal = Number(nominalInput.value);

      if(!nominal | nominal <= 0){
        teks.innerText = 'Masukkan nominal yang valid!'
        return;
      }

      saldo += nominal;
      teks.innerText = `Setor berhasil. Saldo: Rp ${saldo}`

    })

    tarik.addEventListener('click', function(){
      const nominal = Number(nominalInput.value);

      if(!nominal | nominal <= 0){
        teks.innerText = 'Masukkan nominal yang valid!';
        return;
      }
      
      if (nominal > saldo) {
        teks.innerText = 'Saldo tidak cukup!'
      } else{
        saldo -= nominal;
        teks.innerText = `Penarikan berhasil. Saldo: Rp ${saldo}`
      }
    })


    
    
  </script>
</body>
</html>
