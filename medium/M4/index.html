<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 04 - Ubah Tema Halaman</title>
</head>

<body>

  <h2>Soal 04: Ubah Tema Halaman</h2>

  <button id="tombolGelap">Mode Gelap</button>
  <button id="tombolTerang">Mode Terang</button>
  <p id="statusTema">Status tema akan muncul di sini</p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: document.body.style.backgroundColor untuk ubah background halaman
    let gelap = document.getElementById('tombolGelap');
    let terang = document.getElementById('tombolTerang');
    let status = document.getElementById('statusTema');

    gelap.addEventListener('click', function(){
      document.body.style.backgroundColor = 'black';
      status.innerText = "Mode Gelap Aktif";
      status.style.color = "white";
    });

    terang.addEventListener('click', function(){
      document.body.style.backgroundColor = "white";
      status.innerText = "Mode Terang Aktif";
      status.style.color = 'black';
    })


  </script>
</body>

</html>
