<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 02 - Validasi Input Nama</title>
</head>

<body>

  <h2>Soal 02: Validasi Input Nama</h2>

  <input type="text" id="inputNama" placeholder="Tulis namamu di sini..." />
  <button id="tombolCek">Cek Nama</button>
  <p id="hasilCek"></p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Gunakan inputNama.value untuk membaca isi input
    let tombol = document.getElementById('tombolCek');

    tombol.addEventListener('click', function(){
    let teks = document.getElementById('inputNama').value;
      if (teks === ''){
        document.getElementById('hasilCek').innerText = "Nama tidak boleh kosong!";
      } else{
        document.getElementById('hasilCek').innerText = "halo " + teks;
      }
    })

  </script>
</body>

</html>
