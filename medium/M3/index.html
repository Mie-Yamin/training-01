<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Penghitung Mundur</title>
</head>
<body>

  <h2>Soal 03: Penghitung Mundur</h2>

  <p id="angkaHitung">10</p>
  <button id="tombolKurangi">Kurangi</button>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Simpan angka awal di variabel, lalu kurangi setiap klik
    let angka = 10;
    let tombol = document.getElementById('tombolKurangi');

    tombol.addEventListener('click', function(){
      if (angka == 1){
          document.getElementById('angkaHitung').innerText = 'Liftoff!';
          tombol.disabled = 'true';
      } else{
        angka -= 1;
        document.getElementById('angkaHitung').innerText = angka;
      }
    })
    
  </script>
</body>
</html>
