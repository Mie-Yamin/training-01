<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 06 - Tebak Angka</title>
</head>

<body>
  <h2>Soal 06: Tebak Angka</h2>
  <p>Tebak angka rahasia antara 1-10!</p>

  <input type="number" id="inputTebak" placeholder="Masukkan tebakan kamu..." />
  <button id="tombolTebak">Tebak!</button>
  <p id="hasilTebak"></p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Angka rahasia: 7
    const angkaRahasia = 7;
    let tombol = document.getElementById('tombolTebak');
    let hasil = document.getElementById('hasilTebak');

    tombol.addEventListener('click', function(){
      let tebakan = Number(document.getElementById('inputTebak').value);

      if (tebakan === angkaRahasia){
        hasil.innerText = "Benar! Kamu menebak dengan tepat!";
      } else{
        hasil.innerText = "Salah! Coba lagi."
      }
    });

  </script>
</body>

</html>
