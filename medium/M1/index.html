<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 01 - Toggle Teks</title>
</head>
<body>

  <h2>Soal 01: Toggle Teks</h2>

  <p id="teksToggle">Ini teks yang bisa disembunyikan.</p>
  <button id="tombolToggle">Sembunyikan</button>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Gunakan if-else untuk memeriksa kondisi teks saat ini
    let tombol = document.getElementById('tombolToggle');
    tombol.addEventListener('click', function(){
    let teks = document.getElementById('teksToggle');

    if(teks.innerText === 'Ini teks yang bisa disembunyikan.'){
      teks.innerText = '' ;
      tombol.innerText = 'Tampilkan';
    } else{
      teks.innerText = 'Ini teks yang bisa disembunyikan.';
      tombol.innerText ='Sembunyikan';
    }
    })
    
    
  </script>
</body>
</html>
