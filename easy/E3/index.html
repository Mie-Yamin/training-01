<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 03 - Hitung Klik</title>
</head>
<body>

  <h2> Soal 03: Hitung Klik</h2>

  <p id="tampilKlik">Jumlah Klik: 0</p>
  <button id="tombolKlik">Klik Saya!</button>

  <script>
    // Tuliskan JavaScript kamu di sini 
    // Tips: Buat variabel untuk menyimpan jumlah klik
    let tombol = document.getElementById("tombolKlik");
    let jumlah = 0;

    tombol.addEventListener('click', function(){
      jumlah += 1
      document.getElementById("tampilKlik").innerText = "Jumlah Klik: " + jumlah;
    });
  </script>
</body>
</html>
