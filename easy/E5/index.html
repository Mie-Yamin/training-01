<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>Soal 05 - Ubah Warna Teks</title>
</head>

<body>

  <h2>Soal 05: Ubah Warna Teks</h2>

  <p id="teksWarna">JavaScript itu seru!</p>
  <button id="tombolMerah">Warnai Merah</button>

  <script>
    // Tuliskan JavaScript kamu di sini 
    let tombol = document.getElementById("tombolMerah");

    tombol.addEventListener('click', function(){
      document.getElementById('teksWarna').style.color="red";
    });

  </script>
</body>

</html>
