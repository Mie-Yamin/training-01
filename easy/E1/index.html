<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Soal 01 - Hello World</title>
</head>
<body>

  <h2>Soal 01: Hello World!</h2>

  <button id="tombolHello">Tampilkan Pesan</button>
  <p id="pesanTeks"></p>

  <script>
    // Tuliskan JavaScript kamu di sini 
    let tombol = document.getElementById("tombolHello");
    tombol.addEventListener("click", function(){
      document.getElementById("pesanTeks").innerText = "Hello, world!";


    });
  </script>
</body>
</html>
